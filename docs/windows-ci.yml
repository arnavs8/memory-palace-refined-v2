name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: memory-palace-windows
          path: release/*.exe
